services:
  - type: web
    name: quick-filler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: DB_PATH
        value: ./data/app.db
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MAX_PAGINAS
        value: "50"
      - key: OCR_DPI
        value: "300"
      - key: OCR_CONF_THRESHOLD
        value: "65"
      - key: OCR_MAX_CONCORRENTES
        value: "1"
      - key: RETENCAO_HORAS
        value: "24"
